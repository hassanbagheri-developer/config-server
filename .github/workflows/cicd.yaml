name: config

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  IMAGE_NAME: "hassan233/config"

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Docker Image
        run: |
          mvn clean package

      - name: build docker image
        run: |
          docker build -t ${{ env.IMAGE_NAME }} .
          docker build -t ${{ env.IMAGE_NAME }}:1.0.${{ github.run_number }} .

      - name: Log in to DockerHub
        run: echo "${{ env.DOCKERHUB_TOKEN }}" | docker login -u "hassan233" --password-stdin

      - name: Push Docker Image to DockerHub
        run: |
          #TAG_NAME="${{ secrets.ENVIRONMENT }}-backend-1.0.${{ github.run_number }}"
          docker push ${{ env.IMAGE_NAME }}:latest
          docker push ${{ env.IMAGE_NAME }}:1.0.${{ github.run_number }}

  deploy:
    needs: build
    environment: production
    env:
      IP_SERVER: ${{ secrets.IP_SERVER }}
      USERNAME_GITHUB: ${{ secrets.USERNAME_GITHUB }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          set -e

          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_PRIVATE_KEY_GLOBAL }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          SERVER="${{ secrets.IP_SERVER }}"

          if [ -z "$SERVER" ]; then
            echo "ERROR: IP_SERVER is empty"
            exit 1
          fi

          echo "Adding host: $SERVER"

          ssh-keyscan -H "$SERVER" > ~/.ssh/known_hosts

      - name: Deploy with Helm
        run: |
          ssh ${{ secrets.USER_SERVER}}@${{ secrets.IP_SERVER}} 'bash -s' << 'EOF'
          set -e
          cd /opt/github/helm/helm-config-server
          helm upgrade --install config-service . \
            --namespace config \
            --create-namespace \
            --atomic \
            --history-max 10 \
            --wait \
            --timeout 5m \
            --set image.tag=1.0.${{ github.run_number }}
          EOF



  notify-telegram:
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Send Telegram Notification
        env:
          TELEGRAM_USER: ${{ secrets.TELEGRAM_USER }}
        run: |
          REPO="${{ github.repository }}"
          BRANCH="${{ github.ref_name }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          if [ "$STATUS" = "success" ]; then
            EMOJI="✅"
          else
            EMOJI="❌"
          fi

          MESSAGE="$EMOJI Pipeline Report
          Repo: $REPO
          Branch: $BRANCH
          Status: $STATUS

          Docker Images:
          - $IMAGE_NAME:1.0.${{ github.run_number }}

          Link: $RUN_URL"
          
          
          MESSAGE_ENCODED=$(python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.argv[1]))" "$MESSAGE")
          
          curl -s "https://api.callmebot.com/text.php?user=${TELEGRAM_USER}&text=${MESSAGE_ENCODED}"