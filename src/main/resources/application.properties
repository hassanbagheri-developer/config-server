spring.application.name=ConfigServer
server.port=8060
spring.cloud.config.server.git.uri=https://github.com/hassanbagheri-developer/config-server-repo
spring.cloud.config.server.git.clone-on-start=true
spring.cloud.config.server.git.default-label=main
spring.cloud.config.server.git.username=${USERNAME_GITHUB}
spring.cloud.config.server.git.password=${TOKEN_GITHUB}